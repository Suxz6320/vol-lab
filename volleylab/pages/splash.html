/* ============================================================
   排球研习 VolleyLab — 战术板视觉系统 (Tactic Board Design System)
   深色单主题 · 粉笔白线稿 + 排球橙高亮
   ============================================================ */

:root {
  color-scheme: dark;

  /* --- 表面 Surface --- */
  --vl-background: #10151B;      /* 墨黑偏蓝，战术板底色 */
  --vl-surface: #1A212B;         /* 卡片 / 浮层 */
  --vl-surface-2: #222B38;       /* hover / 选中 */
  --vl-surface-3: #171D26;       /* 演示区 / 内嵌面板 */
  --vl-border: #2A3441;          /* 分割线 / 描边 */
  --vl-line-soft: #202832;       /* 列表内细分割 */

  /* --- 文本 Text --- */
  --vl-foreground: #EDF1F5;      /* 粉笔白 */
  --vl-muted-foreground: #8C98A8;/* 说明文字 */
  --vl-ink-3: #5E6A79;           /* 三级文字 */

  /* --- 主强调 Brand（唯一品牌色） --- */
  --vl-primary: #F2A03C;         /* 排球橙 */
  --vl-primary-foreground: #10151B;
  --vl-primary-soft: rgba(242, 160, 60, 0.14);
  --vl-primary-line: rgba(242, 160, 60, 0.44);

  /* --- 语义别名 Semantic aliases --- */
  --vl-card: #1A212B;
  --vl-card-foreground: #EDF1F5;
  --vl-popover: #202834;
  --vl-popover-foreground: #EDF1F5;
  --vl-muted: #171D26;
  --vl-input: #171D26;
  --vl-ring: #F2A03C;

  /* --- 状态 Status --- */
  --state-success: #35C28B;      /* 步骤完成 */
  --state-warning: #F2A03C;
  --state-error: #E2574C;        /* 常见错误 */
  --state-info: #3FA9C9;         /* 数据 / 次要标签 */

  /* --- 线稿与遮罩 Linework & scrim --- */
  --vl-court-line: #3A4756;
  --vl-court-line-soft: #2E3947;
  --vl-stage-light: #F2F4F7;    /* 素模演示台浅灰底，与深色页面形成对比 */
  --vl-scrim: rgba(16, 21, 27, 0.72);
  --vl-scrim-strong: rgba(16, 21, 27, 0.94);
  --vl-overlay-chip: rgba(16, 21, 27, 0.66);

  /* --- 圆角 Radius --- */
  --vl-radius-sm: 4px;
  --vl-radius-md: 8px;
  --vl-radius-lg: 16px;
  --vl-radius-full: 9999px;

  /* --- 字体 Typography --- */
  --vl-font-sans: "PingFang SC", "HarmonyOS Sans", "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --vl-font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", monospace;
}

/* ============================================================
   基础元素
   ============================================================ */

html {
  background: var(--vl-background);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--vl-background);
  color: var(--vl-foreground);
  font-family: var(--vl-font-sans);
  font-size: 15px;
  line-height: 1.55;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

h1, h2, h3, h4 {
  margin: 0;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.01em;
  text-wrap: balance;
  word-break: keep-all;
}

p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; color: inherit; }

img { display: block; max-width: 100%; }

::selection {
  background: var(--vl-primary-soft);
  color: var(--vl-foreground);
}

:focus-visible {
  outline: 2px solid var(--vl-ring);
  outline-offset: 2px;
  border-radius: var(--vl-radius-sm);
}

/* ============================================================
   版式工具（全局复用，保证 11 个页面同一套节奏）
   ============================================================ */

.vl-screen {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 0 20px 32px;
  box-sizing: border-box;
}

.vl-appbar {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 56px;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 0 20px;
  box-sizing: border-box;
  position: relative;
}

.vl-footer {
  width: 100%;
  max-width: 560px;
  margin: 40px auto 0;
  padding: 16px 20px 28px;
  border-top: 1px solid var(--vl-border);
  box-sizing: border-box;
  font-size: 13px;
  line-height: 1.6;
  color: var(--vl-muted-foreground);
}

.vl-iconbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  margin-left: -10px;
  border: 1px solid transparent;
  border-radius: var(--vl-radius-full);
  background: transparent;
  color: var(--vl-foreground);
  transition: background-color 140ms cubic-bezier(.2, .8, .2, 1), border-color 140ms cubic-bezier(.2, .8, .2, 1);
}
.vl-iconbtn:hover { background: var(--vl-surface); border-color: var(--vl-border); }
.vl-iconbtn:active { background: var(--vl-surface-2); }

.vl-appbar-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0;
}

.vl-eyebrow {
  font-family: var(--vl-font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--vl-muted-foreground);
}

.vl-section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 28px 0 12px;
}

.vl-section-title {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.3;
}

.vl-section-link {
  font-size: 13px;
  color: var(--vl-muted-foreground);
  background: none;
  border: 0;
  padding: 4px 0;
  cursor: pointer;
  transition: color 140ms ease;
}
.vl-section-link:hover { color: var(--vl-primary); }

.vl-card {
  background: var(--vl-card);
  border: 1px solid var(--vl-border);
  border-radius: var(--vl-radius-lg);
}

.vl-divider {
  height: 1px;
  background: var(--vl-line-soft);
  border: 0;
  margin: 0;
}

.vl-hair {
  height: 1px;
  background: var(--vl-border);
  border: 0;
  margin: 0;
}

.vl-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 24px;
  padding: 0 8px;
  border-radius: var(--vl-radius-md);
  background: var(--vl-surface-2);
  color: var(--vl-muted-foreground);
  font-size: 11px;
  line-height: 1;
  white-space: nowrap;
}

.vl-tag-brand {
  background: var(--vl-primary);
  color: var(--vl-primary-foreground);
  font-weight: 700;
  border-radius: var(--vl-radius-sm);
}

.vl-tag-outline {
  background: transparent;
  border: 1px solid var(--vl-primary-line);
  color: var(--vl-primary);
}

.vl-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 20px;
  border-radius: var(--vl-radius-full);
  border: 1px solid var(--vl-border);
  background: transparent;
  color: var(--vl-foreground);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
}
.vl-btn:hover { background: var(--vl-surface); }
.vl-btn:active { transform: scale(0.99); }

.vl-btn-primary {
  background: var(--vl-primary);
  border-color: var(--vl-primary);
  color: var(--vl-primary-foreground);
  font-weight: 700;
}
.vl-btn-primary:hover { background: var(--vl-primary); border-color: var(--vl-foreground); }

.vl-num {
  font-family: var(--vl-font-mono);
  font-variant-numeric: tabular-nums;
}

.vl-body {
  font-size: 15px;
  line-height: 1.55;
  color: var(--vl-muted-foreground);
}

.vl-caption {
  font-size: 13px;
  line-height: 1.5;
  color: var(--vl-muted-foreground);
}

.vl-label {
  font-size: 11px;
  line-height: 1.4;
  color: var(--vl-muted-foreground);
}

/* 战术板球场线稿容器 */
.vl-court {
  background: var(--vl-surface-3);
  border: 1px solid var(--vl-border);
  border-radius: var(--vl-radius-lg);
  overflow: hidden;
}

/* 橙色站位点的脉冲 */
@keyframes vl-pulse {
  0%   { transform: scale(1);    opacity: 1; }
  100% { transform: scale(1.55); opacity: 0; }
}

/* 开屏按钮呼吸 */
@keyframes vl-breathe {
  0%   { transform: scale(1); }
  100% { transform: scale(1.04); }
}

/* 球体浮动 */
@keyframes vl-float {
  0%   { transform: translateY(-6px); }
  100% { transform: translateY(6px); }
}

/* 页面入场（CSS 降级版本，Flutter 端用 Interval 交织动画） */
@keyframes vl-rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.vl-rise {
  animation: vl-rise 420ms cubic-bezier(.3, 0, 0, 1) both;
}

/* 自定义滚动条隐藏（横向步骤条 / 手势卡） */
.vl-noscrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.vl-noscrollbar::-webkit-scrollbar { display: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

        animation: vl-rise 460ms cubic-bezier(.3, 0, 0, 1) 200ms both;
      }
      .splash-cta {
        width: 100%;
        max-width: 260px;
        height: 48px;
        min-height: 48px;
        padding: 0 22px;
        font-size: 15px;
      }
      .splash-cta svg,
      .splash-cta i {
        width: 18px;
        height: 18px;
        transition: transform 160ms cubic-bezier(.2, .8, .2, 1);
      }
      .splash-cta:hover svg { transform: translateX(2px); }

      /* --- 版本小字 + 页脚 --- */
      .splash-meta {
        margin-top: auto;
        padding: 30px 20px 4px;
        text-align: center;
        font-size: 13px;
        line-height: 1.6;
        color: var(--vl-muted-foreground);
      }
      .splash-meta .vl-num { letter-spacing: 0.06em; }

      .splash-footer { text-align: center; }
      .splash-footer-note {
        margin-top: 4px;
        font-size: 12px;
        color: var(--vl-muted-foreground);
      }

      @keyframes vl-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
    <script>lucide.createIcons();</script>
</body>
